name: Publish

# Called by release-please.yml, never run on its own. Two reasons: the OIDC
# token's workflow_ref claim names the workflow that STARTED the run, so a
# registry trusting release-please.yml rejects a token minted by a direct run
# of this file; and id-token: write has to come from the caller.
#
# A release created with GITHUB_TOKEN does not trigger `on: release`, which is
# GitHub's guard against workflows setting each other off. So the release job
# calls this one directly rather than relying on the event.
#
# Packagist needs no upload and no token: its GitHub
# App reads the tag from this repository. This job proves the release is sound
# and attaches the archive that Composer will serve.

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to publish, for example v0.1.0.
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Verify the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the archive to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # Ask the other workflows by file name. Counting every check run on
          # the commit would include this job, which waits for itself forever.
          for attempt in $(seq 1 40); do
            pending=0
            failed=0
            for wf in ci.yml commits.yml; do
              state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${wf}/runs?head_sha=${sha}&per_page=1" \
                --jq '.workflow_runs[0] | if . == null then "missing" elif .status != "completed" then "running" else .conclusion end')"
              case "$state" in
                success) ;;
                missing|running) pending=1 ;;
                *) echo "::error::${wf} on ${sha} concluded ${state}"; failed=1 ;;
              esac
            done
            if [ "$failed" = 1 ]; then exit 1; fi
            if [ "$pending" = 0 ]; then echo "ci.yml and commits.yml passed for ${sha}"; exit 0; fi
            echo "waiting for the checks on ${sha} (${attempt}/40)"
            sleep 20
          done
          echo "::error::the checks did not finish in time for ${sha}"
          exit 1

      - uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.35.5
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # v3.1.1

      - name: Tag matches the VERSION constant
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          version="$(php -r 'require "src/Client.php"; echo Checkslip\Client::VERSION;')"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match Client::VERSION ${version}"
            exit 1
          fi

      - run: composer validate --strict
      - run: composer cs
      - run: composer stan
      - run: composer test

      - name: Attach the archive to the release
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="checkslip-sdk-${TAG}.tar.gz"
          git archive --format=tar.gz --prefix="checkslip-sdk-${TAG}/" -o "$name" HEAD
          gh release upload "${TAG}" "$name" --clobber

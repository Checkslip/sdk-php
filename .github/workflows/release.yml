name: Release

# Push a tag such as v0.1.0 to release. Composer needs no registry upload and
# no token: Packagist reads the tag from this repository through its GitHub
# App, so the only job here is to prove the tag is good and write the release
# notes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@9e72090525849c5e82e596468b86eb55e9cc5401 # v2.35.5
        with:
          php-version: "8.3"
          coverage: none
      - uses: ramsey/composer-install@3cf229dc2919194e9e36783941438d17239e8520 # v3.1.1
      - run: composer cs
      - run: composer stan
      - run: composer test
      - name: Tag matches the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^## \[${version}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          }

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && (/^## \[/ || /^\[[^]]+\]: /) {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "no notes for $version" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md $prerelease
